apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fashora-dev

resources:
  - ../../base

namePrefix: dev-

labels:
  - pairs:
      environment: dev

images:
  - name: ujjawalboss/fashora-backend
    newTag: main-76e3841  # Updated to match Jenkins build
  - name: ujjawalboss/fashora-frontend
    newTag: main-76e3841  # Updated to match Jenkins build

patches:
  - target:
      kind: Deployment
      name: fashora-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      # Add this JVM optimization to keep your t3.micro stable
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: JAVA_OPTS
          value: "-Xms128m -Xmx256m -XX:+UseSerialGC"

  - target:
      kind: Deployment
      name: fashora-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: HorizontalPodAutoscaler
      name: fashora-backend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2  # Reduced to 2 to save RAM on free tier

  - target:
      kind: Ingress
      name: fashora-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.fashora.yourdomain.com
