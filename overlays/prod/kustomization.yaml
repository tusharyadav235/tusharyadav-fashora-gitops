apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fashora-prod

resources:
  - ../../base

namePrefix: prod-

commonLabels:
  environment: prod

images:
  - name:   ujjawalboss/fashora-backend:v1
    newTag: main-abc1234 # backend   ← Jenkins patches this line
  - name:   ujjawalboss/fashora-frontend:v1
    newTag: main-abc1234 # frontend  ← Jenkins patches this line

patches:
  # Backend — full production scale
  - target:
      kind: Deployment
      name: fashora-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "768Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1536Mi"

  # Frontend — production scale
  - target:
      kind: Deployment
      name: fashora-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  # HPA — aggressive autoscaling in prod
  - target:
      kind: HorizontalPodAutoscaler
      name: fashora-backend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20

  # Ingress — production domain
  - target:
      kind: Ingress
      name: fashora-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: fashora.yourdomain.com
