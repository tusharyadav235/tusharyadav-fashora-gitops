# ══════════════════════════════════════════════════════════════════════════════
#  Horizontal Pod Autoscaler
#  Requires metrics-server installed in the cluster:
#    kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
# ══════════════════════════════════════════════════════════════════════════════

# ── Backend HPA ────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fashora-backend-hpa
  labels:
    app: fashora-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fashora-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type:               Utilization
          averageUtilization: 60        # scale up when avg CPU > 60 %
    - type: Resource
      resource:
        name: memory
        target:
          type:               Utilization
          averageUtilization: 70        # scale up when avg RAM > 70 %
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type:          Pods
          value:         2
          periodSeconds: 60            # add up to 2 pods per minute
    scaleDown:
      stabilizationWindowSeconds: 300  # wait 5 min before scaling down
      policies:
        - type:          Pods
          value:         1
          periodSeconds: 120           # remove 1 pod per 2 min (gradual)
---
# ── Frontend HPA ───────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fashora-frontend-hpa
  labels:
    app: fashora-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fashora-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type:               Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
