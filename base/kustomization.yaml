apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fashora

resources:
  - namespace.yaml
  - configmap.yaml
  - secretstore.yaml
  - externalsecret.yaml
  - mysql-service.yaml
  - my-sql.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - services.yaml
  - ingress.yaml
  - hpa.yaml

labels:
  - pairs:
      managed-by: argocd
      project: fashora
