apiVersion: apps/v1
kind: Deployment
metadata:
  name: fashora-frontend
  namespace: fashora-dev  # Added namespace for consistency
  labels:
    app: fashora-frontend
    component: frontend
    managed-by: argocd
spec:
  replicas: 1  # Changed from 2 to save space on your small nodes
  selector:
    matchLabels:
      app: fashora-frontend
  strategy:
    type: Recreate # Changed from RollingUpdate to avoid "MaxSurge" pod creation
  template:
    metadata:
      labels:
        app: fashora-frontend
        component: frontend
    spec:
      securityContext:
        runAsNonRoot: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: ujjawalboss/fashora-frontend:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"  # Slightly lowered limit to be "lighter"
              memory: "128Mi"
