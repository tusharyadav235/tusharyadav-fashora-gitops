apiVersion: apps/v1
kind: Deployment
metadata:
  name: fashora-backend
  labels:
    app: fashora-backend
    component: backend
    managed-by: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fashora-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # zero-downtime rolling update
  template:
    metadata:
      labels:
        app: fashora-backend
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8080"
        prometheus.io/path:   "/actuator/prometheus"
    spec:
      # ── Security ──────────────────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser:    1000
        fsGroup:      1000

      # ── Graceful shutdown ──────────────────────────────────────────────────
      terminationGracePeriodSeconds: 60

      # ── Containers ────────────────────────────────────────────────────────
      containers:
        - name: backend
          image: ujjawalboss/fashora-backend:v1   # patched by Kustomize
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # ── Environment from ConfigMap + Secret ───────────────────────────
          envFrom:
            - configMapRef:
                name: fashora-backend-config
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: fashora-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fashora-secrets
                  key: jwt-secret

          # ── Health probes ─────────────────────────────────────────────────
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds:    10          # up to 5 min for first start

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds:       20
            failureThreshold:    3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds:       10
            failureThreshold:    3

          # ── Resources ────────────────────────────────────────────────────
          resources:
            requests:
              cpu:    "250m"
              memory: "512Mi"
            limits:
              cpu:    "1000m"
              memory: "1Gi"

          # ── Security context ──────────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   false
            capabilities:
              drop: ["ALL"]

      # ── Image pull secret (if private registry) ───────────────────────────
      # imagePullSecrets:
      #   - name: dockerhub-secret
