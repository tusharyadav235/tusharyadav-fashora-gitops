apiVersion: apps/v1
kind: Deployment
metadata:
  name: fashora-backend
  namespace: fashora-dev
  labels:
    app: fashora-backend
    component: backend
    managed-by: argocd
spec:
  replicas: 1  # Reduced to fit cluster capacity
  selector:
    matchLabels:
      app: fashora-backend
  strategy:
    type: Recreate # Kills old pod first to free up RAM/CPU
  template:
    metadata:
      labels:
        app: fashora-backend
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8080"
        prometheus.io/path:   "/actuator/prometheus"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser:    1000
        fsGroup:      1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: backend
          image: ujjawalboss/fashora-backend:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fashora-backend-config
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: fashora-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fashora-secrets
                  key: jwt-secret
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi" # Balanced for Spring Boot startup
            limits:
              cpu: "500m"
              memory: "384Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   false
            capabilities:
              drop: ["ALL"]
