apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fashora-secrets
  namespace: fashora-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dev-aws-secretsmanager  # This matches your cluster bridge
    kind: SecretStore
  target:
    name: fashora-secrets         # This is the name your backend looks for
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: fashora/prod         # Must match the Secret Name in AWS
        property: db-password     # Matches your screenshot exactly

    - secretKey: jwt-secret
      remoteRef:
        key: fashora/prod
        property: jwt-secret      # Matches your screenshot exactly

    - secretKey: db-root-password
      remoteRef:
        key: fashora/prod
        property: db-root-password # Matches your screenshot exactly
