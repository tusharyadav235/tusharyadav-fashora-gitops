
---

# ══════════════════════════════════════════════════════════════════════════════
#  MySQL StatefulSet (for non-managed DB; use AWS RDS in production instead)
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fashora-mysql
  labels:
    app: fashora-mysql
spec:
  serviceName: fashora-mysql-svc
  replicas: 1
  selector:
    matchLabels:
      app: fashora-mysql
  template:
    metadata:
      labels:
        app: fashora-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name:  MYSQL_DATABASE
              value: fashora_db
            - name:  MYSQL_USER
              value: fashora_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fashora-secrets
                  key:  db-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fashora-secrets
                  key:  db-root-password
          volumeMounts:
            - name:      mysql-storage
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu:    "250m"
              memory: "512Mi"
            limits:
              cpu:    "1000m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 30
            periodSeconds:       20
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 10
            periodSeconds:       10
  volumeClaimTemplates:
    - metadata:
        name: mysql-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "gp2"          # AWS EKS gp2 StorageClass
        resources:
          requests:
            storage: 10Gi
---

