---
# ── Production Environment ──────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name:      fashora-prod
  namespace: argocd
  labels:
    project:     fashora
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL:        https://github.com/tusharyadav235/tusharyadav-fashora-gitops.git   # ← change
    targetRevision: main
    path:           overlays/prod

  destination:
    server:    https://kubernetes.default.svc
    namespace: fashora-prod

  syncPolicy:
    automated:
      prune:    true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit:       5
      backoff:
        duration:    10s
        factor:      2
        maxDuration: 5m

  ignoreDifferences:
    - group:     apps
      kind:      Deployment
      jsonPointers:
        - /spec/replicas
