# ══════════════════════════════════════════════════════════════════════════════
#  ArgoCD Application Manifests
#  Apply these ONCE to your EKS cluster:
#    kubectl apply -f argocd-apps.yaml -n argocd
#
#  ArgoCD will then continuously watch the GitOps repo and sync automatically.
# ══════════════════════════════════════════════════════════════════════════════

# ── Development Environment ─────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name:      fashora-dev
  namespace: argocd
  labels:
    project:     fashora
    environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # cleanup on delete
spec:
  project: default

  source:
    repoURL:        https://github.com/tusharyadav235/tusharyadav-fashora-gitops.git   # ← change
    targetRevision: main
    path:           overlays/dev

  destination:
    server:    https://kubernetes.default.svc   # in-cluster
    namespace: fashora-dev

  syncPolicy:
    automated:
      prune:    true    # delete removed resources
      selfHeal: true    # revert manual kubectl changes
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration:    5s
        factor:      2
        maxDuration: 3m

  # ── Health checks ────────────────────────────────────────────────────────
  ignoreDifferences:
    - group:     apps
      kind:      Deployment
      jsonPointers:
        - /spec/replicas    # ignore HPA-managed replica count

---
# ── Staging Environment ─────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name:      fashora-staging
